name: Markdown Check

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-check.yml"

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
